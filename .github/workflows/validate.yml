name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Catalog, generation and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Verify generated indexes are current
        run: python scripts/generate_indexes.py --check

      - name: Verify reports are current
        run: python scripts/generate_reports.py --check

      - name: Verify expansion reports are current
        run: python scripts/generate_expansion_reports.py --check

      - name: Verify generated assets are current
        run: python scripts/generate_assets.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check local Markdown links
        run: python scripts/check_links.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md" "#node_modules" "#**/.github/ISSUE_TEMPLATE/**"
