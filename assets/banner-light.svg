  <text x="62" y="136" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="800" letter-spacing="-1.6" fill="#0f172a">OpenCode Skills Hub</text>
  <text x="64" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#4338ca">Discover. Build. Create. Automate.</text>
  <text x="64" y="206" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">An evidence-first catalog of skills, agents, plugins, MCP servers and collections.</text>
  <rect x="64" y="230" width="128" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/><text x="128.0" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#3730a3">123 RESOURCES</text><rect x="202" y="230" width="136" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/><text x="270.0" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#3730a3">46 COLLECTIONS</text><rect x="348" y="230" width="128" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/><text x="412.0" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#3730a3">18 CATEGORIES</text><rect x="486" y="230" width="136" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/><text x="554.0" y="250" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#3730a3">EVIDENCE-FIRST</text>
